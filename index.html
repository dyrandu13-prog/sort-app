<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORT — Inscription & Validation</title>
  <style>
    :root {
      --bg: #f3f7f5;
      --card: #ffffff;
      --ink: #17211d;
      --muted: #586962;
      --sage: #2b6e5c;
      --sage-soft: #e4f1ed;
      --amber: #c46619;
      --amber-soft: #fff1e3;
      --blue: #234e70;
      --blue-soft: #e6eff6;
      --danger: #b33939;
      --danger-soft: #fdecec;
      --border: #d9e4de;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(23, 33, 29, 0.06);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: var(--sage);
      letter-spacing: 0.5px;
    }

    .pill {
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--sage-soft);
      color: var(--sage);
      white-space: nowrap;
    }

    .pill.amber { background: var(--amber-soft); color: var(--amber); }
    .pill.blue { background: var(--blue-soft); color: var(--blue); }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fff;
    }

    .field { margin-bottom: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
