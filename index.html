<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORT — Prototype</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --card: #ffffff;
      --ink: #17211d;
      --muted: #5b6b64;
      --sage: #2f6f5e;
      --sage-soft: #e6f2ee;
      --amber: #d97724;
      --amber-soft: #fff2e5;
      --danger: #b43b3b;
      --danger-soft: #fdecec;
      --border: #dce5e0;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(23, 33, 29, 0.06);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand { font-size: 22px; font-weight: 800; color: var(--sage); letter-spacing: 0.5px; }
    .pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--sage-soft);
      color: var(--sage);
    }
    .user-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--bg);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    select, input, textarea, button {
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 9px 11px;
    }
    input, textarea, select { width: 100%; background: #fff; color: var(--ink); }
    textarea { min-height: 62px; resize: vertical; }
    button {
      cursor: pointer;
      background: var(--sage);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    button.secondary {
      background: var(--sage-soft);
      color: var(--sage);
    }
    button.warn {
      background: var(--amber-soft);
      color: var(--amber);
    }
    button.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tabs button { padding: 10px; }
    .tabs button.inactive { background: var(--bg); color: var(--muted); }
    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 12px;
      background: #fff;
    }
    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .gear-box {
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: 10px;
      background: var(--amber-soft);
      font-size: 12.5px;
    }
    .notice {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--sage-soft);
      color: var(--sage);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .notice.err { background: var(--danger-soft); color: var(--danger); }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">SORT</div>
      <span class="pill">100% gratuit • Sans swipe</span>
    </header>

    <div class="user-bar">
      <span style="white-space:nowrap; font-weight:600;">Moi :</span>
      <select id="currentUser" onchange="render()"></select>
    </div>

    <div id="feedback" class="notice hidden"></div>

    <div class="tabs">
      <button id="tabFeed" onclick="setTab('feed')">Sorties locales</button>
      <button id="tabCreate" class="inactive" onclick="setTab('create')">Créer une sortie</button>
    </div>

    <div id="viewFeed"></div>

    <div id="viewCreate" class="hidden">
      <div class="card">
        <div class="field">
          <label>Titre de la sortie</label>
          <input id="evTitle" placeholder="Ex. : Balade parc + Switch" />
        </div>
        <div class="field">
          <label>Nombre de places au total (2 = 1v1, 3 à 6 = groupe)</label>
          <select id="evSpots" onchange="syncMixityRules()">
            <option value="2">2 personnes (1v1 — mixte obligatoire)</option>
            <option value="3" selected>3 personnes (groupe)</option>
            <option value="4">4 personnes (groupe)</option>
            <option value="6">6 personnes (groupe)</option>
          </select>
        </div>
        <div class="field">
          <label>Public / Mixité</label>
          <select id="evMixity"></select>
        </div>
        <div class="field">
          <label>Zone approximative (publique)</label>
          <input id="evZone" value="Centre-ville / Parc" />
        </div>
        <div class="field">
          <label>Point de RDV précis (visible après validation)</label>
          <input id="evExact" value="Entrée principale près de la fontaine" />
        </div>
        <div class="field">
          <label>Matériel déjà prévu par l'organisateur (optionnel)</label>
          <input id="evHasGear" placeholder="Ex. : 2 manettes, ballon, enceinte" />
        </div>
        <div class="field">
          <label>Ce que les participants peuvent ramener (optionnel)</label>
          <input id="evBringGear" placeholder="Ex. : eau, chips, jeu de cartes" />
        </div>
        <button style="width:100%;" onclick="createEvent()">Publier la sortie</button>
      </div>
    </div>
  </div>

  <script>
    const users = [
      { id: "u1", name: "Léa", gender: "Femme" },
      { id: "u2", name: "Camille", gender: "Femme" },
      { id: "u3", name: "Mehdi", gender: "Homme" },
      { id: "u4", name: "Lucas", gender: "Homme" }
    ];

    const blockedPairs = [
      ["u1", "u3"] // Léa et Mehdi bloqués entre eux : masquage croisé sur les sorties d'un tiers
    ];

    let events = [
      {
        id: "e1",
        title: "Rando douce & café thermos",
        hostId: "u1",
        totalSpots: 4,
        mixity: "Femmes",
        zone: "Colline nord",
        exactSpot: "Parking du belvédère",
        hasGear: "Thermos café, carte du sentier",
        bringGear: "Baskets, gourde, encas",
        participants: ["u1"]
      },
      {
        id: "e2",
        title: "Session Mario Kart & snacks",
        hostId: "u4",
        totalSpots: 3,
        mixity: "Mixte",
        zone: "Quartier gare",
        exactSpot: "Café associatif Le Coin",
        hasGear: "Console + 2 manettes",
        bringGear: "Une manette en rab ou biscuits",
        participants: ["u4"]
      }
    ];

    let activeTab = "feed";

    function initSelects() {
      const sel = document.getElementById("currentUser");
      sel.innerHTML = users.map(u => `<option value="${u.id}">${u.name} (${u.gender})</option>`).join("");
      syncMixityRules();
    }

    function getUser(id) {
      return users.find(u => u.id === id);
    }

    function isBlockedWithAnyParticipant(viewerId, participantIds) {
      return participantIds.some(pid =>
        pid !== viewerId &&
        blockedPairs.some(([a, b]) => (a === viewerId && b === pid) || (a === pid && b === viewerId))
      );
    }

    function syncMixityRules() {
      const spots = Number(document.getElementById("evSpots").value);
      const me = getUser(document.getElementById("currentUser").value);
      const mixSel = document.getElementById("evMixity");

      if (spots === 2) {
        mixSel.innerHTML = `<option value="Mixte">Mixte (obligatoire en 1v1)</option>`;
        mixSel.disabled = true;
      } else {
        mixSel.disabled = false;
        const sameGenderLabel = me.gender === "Femme" ? "Femmes" : "Hommes";
        mixSel.innerHTML = `
          <option value="Mixte">Mixte (ouvert à tous)</option>
          <option value="${sameGenderLabel}">Entre ${sameGenderLabel.toLowerCase()} (même genre que l'organisateur)</option>
        `;
      }
    }

    function showMsg(text, isErr = false) {
      const el = document.getElementById("feedback");
      el.textContent = text;
      el.className = isErr ? "notice err" : "notice";
      el.classList.remove("hidden");
    }

    function setTab(tab) {
      activeTab = tab;
      document.getElementById("viewFeed").classList.toggle("hidden", tab !== "feed");
      document.getElementById("viewCreate").classList.toggle("hidden", tab !== "create");
      document.getElementById("tabFeed").className = tab === "feed" ? "" : "inactive";
      document.getElementById("tabCreate").className = tab === "create" ? "" : "inactive";
      if (tab === "create") syncMixityRules();
      render();
    }

    function createEvent() {
      const me = getUser(document.getElementById("currentUser").value);
      const title = document.getElementById("evTitle").value.trim() || "Sortie amicale";
      const totalSpots = Number(document.getElementById("evSpots").value);
      const mixity = totalSpots === 2 ? "Mixte" : document.getElementById("evMixity").value;
      const zone = document.getElementById("evZone").value.trim() || "À proximité";
      const exactSpot = document.getElementById("evExact").value.trim() || "Point de RDV confirmé aux inscrits";
      const hasGear = document.getElementById("evHasGear").value.trim();
      const bringGear = document.getElementById("evBringGear").value.trim();

      events.unshift({
        id: "e" + Date.now(),
        title,
        hostId: me.id,
        totalSpots,
        mixity,
        zone,
        exactSpot,
        hasGear,
        bringGear,
        participants: [me.id]
      });

      document.getElementById("evTitle").value = "";
      document.getElementById("evHasGear").value = "";
      document.getElementById("evBringGear").value = "";
      showMsg("Sortie publiée !");
      setTab("feed");
    }

    function toggleJoin(eventId) {
      const me = getUser(document.getElementById("currentUser").value);
      const ev = events.find(x => x.id === eventId);
      if (!ev) return;

      if (ev.participants.includes(me.id)) {
        if (ev.hostId === me.id) {
          showMsg("L'organisateur reste inscrit tant que la sortie n'est pas annulée.", true);
          return;
        }
        ev.participants = ev.participants.filter(id => id !== me.id);
        showMsg("Tu t'es désisté : la place s'est libérée.");
        render();
        return;
      }

      if (ev.participants.length >= ev.totalSpots) {
        showMsg("Complet : plus de place disponible.", true);
        return;
      }

      if (ev.mixity === "Femmes" && me.gender !== "Femme") {
        showMsg("Sortie réservée aux femmes.", true);
        return;
      }
      if (ev.mixity === "Hommes" && me.gender !== "Homme") {
        showMsg("Sortie réservée aux hommes.", true);
        return;
      }

      ev.participants.push(me.id);
      showMsg("Inscription validée ! Point de RDV précis débloqué.");
      render();
    }

    function render() {
      syncMixityRules();
      const me = getUser(document.getElementById("currentUser").value);
      const container = document.getElementById("viewFeed");

      const visibleEvents = events.filter(ev => !isBlockedWithAnyParticipant(me.id, ev.participants));

      if (!visibleEvents.length) {
        container.innerHTML = `<div class="card"><div class="meta">Aucune sortie visible ici pour le moment.</div></div>`;
        return;
      }

      container.innerHTML = visibleEvents.map(ev => {
        const host = getUser(ev.hostId);
        const joined = ev.participants.includes(me.id);
        const names = ev.participants.map(id => getUser(id).name).join(", ");
        const locationText = joined
          ? `<strong>RDV précis :</strong> ${ev.exactSpot} (${ev.zone})`
          : `<strong>Zone :</strong> ${ev.zone} <em>(RDV exact après inscription)</em>`;

        const gearHtml = (ev.hasGear || ev.bringGear) ? `
          <div class="gear-box">
            ${ev.hasGear ? `<div><strong>Déjà prévu :</strong> ${ev.hasGear}</div>` : ""}
            ${ev.bringGear ? `<div><strong>À ramener :</strong> ${ev.bringGear}</div>` : ""}
          </div>
        ` : "";

        const formatLabel = ev.totalSpots === 2 ? "1v1 (2 max)" : `Groupe (${ev.totalSpots} max)`;

        return `
          <div class="card">
            <div class="row">
              <strong>${ev.title}</strong>
              <span class="pill">${ev.mixity} • ${formatLabel}</span>
            </div>
            <div class="meta">Organisé par ${host.name} • Places : ${ev.participants.length}/${ev.totalSpots} (${names})</div>
            <div class="meta">${locationText}</div>
            ${gearHtml}
            <div style="margin-top:10px;" class="row">
              ${
                ev.hostId === me.id
                  ? `<span class="meta">Tu organises cette sortie</span>`
                  : joined
                    ? `<button class="danger" onclick="toggleJoin('${ev.id}')">Me désister</button>`
                    : `<button onclick="toggleJoin('${ev.id}')">Je suis chaud</button>`
              }
            </div>
          </div>
        `;
      }).join("");
    }

    initSelects();
    render();
  </script>
</body>
</html>
