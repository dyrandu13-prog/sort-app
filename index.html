<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORT — Prototype</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --card: #ffffff;
      --ink: #17211d;
      --muted: #5b6b64;
      --sage: #2f6f5e;
      --sage-soft: #e6f2ee;
      --amber: #d97724;
      --amber-soft: #fff2e5;
      --danger: #b43b3b;
      --danger-soft: #fdecec;
      --border: #dce5e0;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(23, 33, 29, 0.06);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand { font-size: 22px; font-weight: 800; color: var(--sage); letter-spacing: 0.5px; }
    .pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--sage-soft);
      color: var(--sage);
    }
    .user-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--bg);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    select, input, textarea, button {
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 9px 11px;
    }
    input, textarea, select { width: 100%; background: #fff; color: var(--ink); }
    button {
      cursor: pointer;
      background: var(--sage);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    button.secondary {
      background: var(--sage-soft);
      color: var(--sage);
    }
    button.filter-active {
      background: var(--amber);
      color: #fff;
    }
    button.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }
    button.danger-solid {
      background: var(--danger);
      color: #fff;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .tabs button { padding: 10px; }
    .tabs button.inactive { background: var(--bg); color: var(--muted); }
    .sub-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .sub-bar button {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 12px;
      background: #fff;
    }
    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .gear-box {
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: 10px;
      background: var(--amber-soft);
      font-size: 12.5px;
    }
    .req-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 12.5px;
    }
    .req-item {
      padding-top: 8px;
      margin-top: 8px;
      border-top: 1px solid var(--border);
    }
    .req-item:first-child {
      padding-top: 0;
      margin-top: 0;
      border-top: none;
    }
    .confirm-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 12.5px;
    }
    .notice {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--sage-soft);
      color: var(--sage);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .notice.err { background: var(--danger-soft); color: var(--danger); }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">SORT <span style="font-size:11px;font-weight:600;opacity:0.7;">v0.8</span></div>
      <span class="pill">100% gratuit • Sans swipe</span>
    </header>

    <div class="user-bar">
      <span style="white-space:nowrap; font-weight:600;">Moi :</span>
      <select id="currentUser" onchange="onUserChange()"></select>
    </div>

    <div id="feedback" class="notice hidden"></div>

    <div class="tabs">
      <button id="tabFeed" type="button" onclick="setTab('feed')">Sorties locales</button>
      <button id="tabCreate" type="button" class="inactive" onclick="setTab('create')">Créer une sortie</button>
    </div>

    <div id="feedSubBar" class="sub-bar">
      <button id="btnSavedFilter" type="button" class="secondary" onclick="toggleSavedFilter()">Mes sorties enregistrées (0)</button>
    </div>

    <div id="viewFeed"></div>

    <div id="viewCreate" class="hidden">
      <form id="createForm" class="card" onsubmit="handleCreateSubmit(event)">
        <div class="field">
          <label for="evTitle">Titre de la sortie</label>
          <input id="evTitle" placeholder="Ex. : Balade parc + Switch" />
        </div>
        <div class="field">
          <label for="evSpots">Nombre de places au total (2 = 1v1, 3 à 6 = groupe)</label>
          <select id="evSpots" onchange="syncMixityRules()">
            <option value="2">2 personnes (1v1 — mixte obligatoire)</option>
            <option value="3" selected>3 personnes (groupe)</option>
            <option value="4">4 personnes (groupe)</option>
            <option value="6">6 personnes (groupe)</option>
          </select>
        </div>
        <div class="field">
          <label for="evMixity">Public / Mixité</label>
          <select id="evMixity"></select>
        </div>
        <div class="field">
          <label for="evAccess">Validation des participants</label>
          <select id="evAccess">
            <option value="auto" selected>Validation automatique (entrée directe)</option>
            <option value="manual">Validation manuelle par le créateur</option>
          </select>
        </div>
        <div class="field">
          <label for="evZone">Zone approximative (publique)</label>
          <input id="evZone" value="Centre-ville / Parc" />
        </div>
        <div class="field">
          <label for="evExact">Point de RDV précis (visible après validation)</label>
          <input id="evExact" value="Entrée principale près de la fontaine" />
        </div>
        <div class="field">
          <label for="evHasGear">Matériel déjà prévu par l'organisateur (optionnel)</label>
          <input id="evHasGear" placeholder="Ex. : 2 manettes, ballon, enceinte" />
        </div>
        <div class="field">
          <label for="evBringGear">Ce que les participants peuvent ramener (optionnel)</label>
          <input id="evBringGear" placeholder="Ex. : eau, chips, jeu de cartes" />
        </div>
        <button id="publishBtn" type="submit" style="width:100%;">Publier la sortie</button>
      </form>
    </div>
  </div>

  <script>
    const users = [
      { id: "u1", name: "Léa", age: 25, gender: "Femme", vibe: "Rando tranquille, café, ciné indé" },
      { id: "u2", name: "Camille", age: 27, gender: "Femme", vibe: "Jeux de société, balades, apéro doux" },
      { id: "u3", name: "Mehdi", age: 29, gender: "Homme", vibe: "Switch, foot détendu, bons restos" },
      { id: "u4", name: "Lucas", age: 24, gender: "Homme", vibe: "Rétrogaming, brocantes, balade" }
    ];

    const blockedPairs = [
      ["u1", "u3"]
    ];

    let savedByUser = {};
    let onlySaved = false;
    let pendingDeleteId = null;

    let events = [
      {
        id: "e1",
        title: "Rando douce & café thermos",
        hostId: "u1",
        totalSpots: 4,
        mixity: "Femmes",
        accessMode: "manual",
        zone: "Colline nord",
        exactSpot: "Parking du belvédère",
        hasGear: "Thermos café, carte du sentier",
        bringGear: "Baskets, gourde, encas",
        participants: ["u1"],
        pendingIds: []
      },
      {
        id: "e2",
        title: "Session Mario Kart & snacks",
        hostId: "u4",
        totalSpots: 3,
        mixity: "Mixte",
        accessMode: "auto",
        zone: "Quartier gare",
        exactSpot: "Café associatif Le Coin",
        hasGear: "Console + 2 manettes",
        bringGear: "Une manette en rab ou biscuits",
        participants: ["u4"],
        pendingIds: []
      }
    ];

    let activeTab = "feed";

    function initSelects() {
      const sel = document.getElementById("currentUser");
      sel.innerHTML = users.map(u => `<option value="${u.id}">${u.name} (${u.age}a • ${u.gender})</option>`).join("");
      syncMixityRules();
    }

    function getUser(id) {
      return users.find(u => u.id === id) || users[0];
    }

    function isBlockedBetween(idA, idB) {
      if (!idA || !idB || idA === idB) return false;
      return blockedPairs.some(([a, b]) => (a === idA && b === idB) || (a === idB && b === idA));
    }

    function isBlockedWithAnyParticipant(viewerId, participantIds) {
      return participantIds.some(pid => pid !== viewerId && isBlockedBetween(viewerId, pid));
    }

    function isSaved(userId, eventId) {
      return Array.isArray(savedByUser[userId]) && savedByUser[userId].includes(eventId);
    }

    function toggleSavedFilter() {
      onlySaved = !onlySaved;
      render();
    }

    function toggleSave(eventId) {
      const me = getUser(document.getElementById("currentUser").value);
      const list = savedByUser[me.id] || [];
      if (list.includes(eventId)) {
        savedByUser[me.id] = list.filter(id => id !== eventId);
        render();
        showMsg(`Sortie retirée des enregistrées pour ${me.name}.`);
      } else {
        savedByUser[me.id] = [...list, eventId];
        render();
        showMsg(`Sortie enregistrée uniquement pour ${me.name}.`);
      }
    }

    function askDeleteEvent(eventId) {
      pendingDeleteId = eventId;
      render();
    }

    function cancelDeleteEvent() {
      pendingDeleteId = null;
      render();
    }

    function confirmDeleteEvent(eventId) {
      const me = getUser(document.getElementById("currentUser").value);
      const idx = events.findIndex(x => String(x.id) === String(eventId));
      if (idx === -1) {
        showMsg("Sortie introuvable.", true);
        return;
      }
      const ev = events[idx];
      if (String(ev.hostId) !== String(me.id)) {
        showMsg("Seul le créateur peut supprimer cette sortie.", true);
        return;
      }
      const deletedTitle = ev.title;
      events.splice(idx, 1);
      pendingDeleteId = null;
      Object.keys(savedByUser).forEach(uid => {
        savedByUser[uid] = (savedByUser[uid] || []).filter(id => String(id) !== String(eventId));
      });
      render();
      showMsg(`Sortie "${deletedTitle}" supprimée.`);
    }

    function syncMixityRules() {
      const spots = Number(document.getElementById("evSpots").value);
      const me = getUser(document.getElementById("currentUser").value);
      const mixSel = document.getElementById("evMixity");

      if (spots === 2) {
        mixSel.innerHTML = `<option value="Mixte">Mixte (obligatoire en 1v1)</option>`;
        mixSel.disabled = true;
      } else {
        mixSel.disabled = false;
        const sameGenderLabel = me.gender === "Femme" ? "Femmes" : "Hommes";
        mixSel.innerHTML = `
          <option value="Mixte">Mixte (ouvert à tous)</option>
          <option value="${sameGenderLabel}">Entre ${sameGenderLabel.toLowerCase()} (même genre que l'organisateur)</option>
        `;
      }
    }

    function hideMsg() {
      const el = document.getElementById("feedback");
      el.textContent = "";
      el.className = "notice hidden";
    }

    function showMsg(text, isErr = false) {
      const el = document.getElementById("feedback");
      el.textContent = text;
      el.className = isErr ? "notice err" : "notice";
      el.classList.remove("hidden");
    }

    function onUserChange() {
      pendingDeleteId = null;
      onlySaved = false;
      hideMsg();
      syncMixityRules();
      render();
    }

    function setTab(tab) {
      activeTab = tab;
      pendingDeleteId = null;
      document.getElementById("viewFeed").classList.toggle("hidden", tab !== "feed");
      document.getElementById("viewCreate").classList.toggle("hidden", tab !== "create");
      document.getElementById("feedSubBar").classList.toggle("hidden", tab !== "feed");
      document.getElementById("tabFeed").className = tab === "feed" ? "" : "inactive";
      document.getElementById("tabCreate").className = tab === "create" ? "" : "inactive";
      if (tab === "create") syncMixityRules();
      render();
    }

    function handleCreateSubmit(e) {
      e.preventDefault();
      try {
        const me = getUser(document.getElementById("currentUser").value);
        const titleInput = document.getElementById("evTitle").value.trim();
        const title = titleInput || "Sortie amicale";
        const totalSpots = Number(document.getElementById("evSpots").value) || 3;
        const mixity = totalSpots === 2 ? "Mixte" : (document.getElementById("evMixity").value || "Mixte");
        const accessMode = document.getElementById("evAccess").value || "auto";
        const zone = document.getElementById("evZone").value.trim() || "À proximité";
        const exactSpot = document.getElementById("evExact").value.trim() || "Point de RDV confirmé aux inscrits";
        const hasGear = document.getElementById("evHasGear").value.trim();
        const bringGear = document.getElementById("evBringGear").value.trim();

        events.unshift({
          id: "e_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          title,
          hostId: me.id,
          totalSpots,
          mixity,
          accessMode,
          zone,
          exactSpot,
          hasGear,
          bringGear,
          participants: [me.id],
          pendingIds: []
        });

        document.getElementById("evTitle").value = "";
        document.getElementById("evHasGear").value = "";
        document.getElementById("evBringGear").value = "";
        setTab("feed");
        showMsg(`Sortie "${title}" publiée (${accessMode === "auto" ? "validation auto" : "validation manuelle"}).`);
      } catch (err) {
        showMsg("Erreur lors de la publication : " + err.message, true);
      }
    }

    function toggleJoin(eventId) {
      const me = getUser(document.getElementById("currentUser").value);
      const ev = events.find(x => String(x.id) === String(eventId));
      if (!ev) return;

      if (ev.participants.includes(me.id)) {
        if (ev.hostId === me.id) {
          showMsg("Tu es l'organisateur : clique sur « Supprimer la sortie » pour la retirer.", true);
          return;
        }
        ev.participants = ev.participants.filter(id => id !== me.id);
        render();
        showMsg("Tu t'es désisté : la place s'est libérée.");
        return;
      }

      if (ev.pendingIds.includes(me.id)) {
        ev.pendingIds = ev.pendingIds.filter(id => id !== me.id);
        render();
        showMsg("Ta demande de participation a été annulée.");
        return;
      }

      if (isBlockedWithAnyParticipant(me.id, ev.participants)) {
        showMsg("Action impossible : blocage actif avec un participant de cette sortie.", true);
        return;
      }

      if (ev.participants.length >= ev.totalSpots) {
        showMsg("Complet : plus de place disponible.", true);
        return;
      }

      if (ev.mixity === "Femmes" && me.gender !== "Femme") {
        showMsg("Sortie réservée aux femmes.", true);
        return;
      }
      if (ev.mixity === "Hommes" && me.gender !== "Homme") {
        showMsg("Sortie réservée aux hommes.", true);
        return;
      }

      if (ev.accessMode === "auto") {
        ev.participants.push(me.id);
        render();
        showMsg("Validation automatique réussie ! Point de RDV précis débloqué.");
      } else {
        ev.pendingIds.push(me.id);
        render();
        showMsg("Demande envoyée au créateur pour validation manuelle.");
      }
    }

    function reviewRequest(eventId, applicantId, accept) {
      const me = getUser(document.getElementById("currentUser").value);
      const ev = events.find(x => String(x.id) === String(eventId));
      if (!ev) return;
      if (String(ev.hostId) !== String(me.id)) {
        showMsg("Seul le créateur peut valider ou refuser.", true);
        return;
      }

      ev.pendingIds = ev.pendingIds.filter(id => id !== applicantId);
      const applicant = getUser(applicantId);

      if (!accept) {
        render();
        showMsg(`Demande de ${applicant.name} refusée.`);
        return;
      }

      if (isBlockedWithAnyParticipant(applicantId, ev.participants)) {
        render();
        showMsg(`Impossible d'accepter ${applicant.name} : blocage actif avec un participant.`, true);
        return;
      }

      if (ev.participants.length >= ev.totalSpots) {
        render();
        showMsg("Impossible d'accepter : la sortie est complète.", true);
        return;
      }

      if (!ev.participants.includes(applicantId)) {
        ev.participants.push(applicantId);
      }
      render();
      showMsg(`${applicant.name} a été accepté(e) sur la sortie.`);
    }

    function render() {
      const me = getUser(document.getElementById("currentUser").value);
      const container = document.getElementById("viewFeed");

      const baseVisible = events.filter(ev => !isBlockedWithAnyParticipant(me.id, ev.participants));
      const savedCount = baseVisible.filter(ev => isSaved(me.id, ev.id)).length;

      const filterBtn = document.getElementById("btnSavedFilter");
      filterBtn.textContent = onlySaved
        ? `Afficher toutes les sorties (${baseVisible.length})`
        : `Mes sorties enregistrées (${savedCount})`;
      filterBtn.className = onlySaved ? "filter-active" : "secondary";

      const visibleEvents = onlySaved
        ? baseVisible.filter(ev => isSaved(me.id, ev.id))
        : baseVisible;

      if (!visibleEvents.length) {
        container.innerHTML = `<div class="card"><div class="meta">${
          onlySaved ? "Aucune sortie enregistrée pour ce profil." : "Aucune sortie visible ici pour le moment."
        }</div></div>`;
        return;
      }

      container.innerHTML = visibleEvents.map(ev => {
        const host = getUser(ev.hostId);
        const isHost = String(ev.hostId) === String(me.id);
        const joined = ev.participants.includes(me.id);
        const pending = ev.pendingIds.includes(me.id);
        const saved = isSaved(me.id, ev.id);
        const isConfirmingDelete = isHost && String(pendingDeleteId) === String(ev.id);
        const names = ev.participants.map(id => getUser(id).name).join(", ");
        const locationText = joined
          ? `<strong>RDV précis :</strong> ${ev.exactSpot} (${ev.zone})`
          : `<strong>Zone :</strong> ${ev.zone} <em>(RDV exact après validation)</em>`;

        const gearHtml = (ev.hasGear || ev.bringGear) ? `
          <div class="gear-box">
            ${ev.hasGear ? `<div><strong>Déjà prévu :</strong> ${ev.hasGear}</div>` : ""}
            ${ev.bringGear ? `<div><strong>À ramener :</strong> ${ev.bringGear}</div>` : ""}
          </div>
        ` : "";

        const hostRequestsHtml = (isHost && ev.accessMode === "manual" && ev.pendingIds.length) ? `
          <div class="req-box">
            <strong>À valider manuellement (${ev.pendingIds.length}) :</strong>
            ${ev.pendingIds.map(pid => {
              const u = getUser(pid);
              return `
                <div class="req-item">
                  <div><strong>${u.name}</strong> • ${u.age} ans • ${u.gender}</div>
                  <div class="meta">Vibe : ${u.vibe}</div>
                  <div style="margin-top:6px;" class="row">
                    <button type="button" onclick="reviewRequest('${ev.id}', '${u.id}', true)">Accepter</button>
                    <button type="button" class="danger" onclick="reviewRequest('${ev.id}', '${u.id}', false)">Refuser</button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        ` : "";

        const formatLabel = ev.totalSpots === 2 ? "1v1 (2 max)" : `Groupe (${ev.totalSpots} max)`;
        const accessLabel = ev.accessMode === "auto" ? "Validation auto" : "Validation manuelle";

        let mainActionBtn = "";
        if (isHost) {
          mainActionBtn = `<button type="button" class="danger" onclick="askDeleteEvent('${ev.id}')">Supprimer la sortie</button>`;
        } else if (joined) {
          mainActionBtn = `<button type="button" class="danger" onclick="toggleJoin('${ev.id}')">Me désister</button>`;
        } else if (pending) {
          mainActionBtn = `<button type="button" class="filter-active" onclick="toggleJoin('${ev.id}')">En attente (annuler)</button>`;
        } else {
          mainActionBtn = `<button type="button" onclick="toggleJoin('${ev.id}')">Je suis chaud</button>`;
        }

        return `
          <div class="card">
            <div class="row">
              <strong>${ev.title}</strong>
              <span class="pill">${ev.mixity} • ${formatLabel}</span>
            </div>
            <div class="meta">Organisé par ${host.name} • ${accessLabel} • Places : ${ev.participants.length}/${ev.totalSpots} (${names})</div>
            <div class="meta">${locationText}</div>
            ${gearHtml}
            ${hostRequestsHtml}
            <div style="margin-top:10px;" class="row">
              <div class="row">
                ${mainActionBtn}
                <button type="button" class="secondary" onclick="toggleSave('${ev.id}')">${saved ? "Enregistrée ✓" : "Enregistrer"}</button>
              </div>
            </div>
            ${
              isConfirmingDelete
                ? `<div class="confirm-box">
                     <div>Supprimer définitivement cette sortie ?</div>
                     <div style="margin-top:8px;" class="row">
                       <button type="button" class="danger-solid" onclick="confirmDeleteEvent('${ev.id}')">Oui, supprimer</button>
                       <button type="button" class="secondary" onclick="cancelDeleteEvent()">Annuler</button>
                     </div>
                   </div>`
                : ""
            }
          </div>
        `;
      }).join("");
    }

    initSelects();
    render();
  </script>
</body>
</html>
